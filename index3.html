<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />

  <title>بوابة الأنشطة المدرسية - ثانوية الجزائر بنات</title>

  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #2563eb;
      --accent: #0d9488;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * { box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      color: #fff;
      padding: 2rem 1rem 2.5rem;
      text-align: center;
      position: relative;
      box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    }

    .admin-trigger {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 700;
      transition: 0.2s;
    }
    .admin-trigger:hover { background: rgba(255,255,255,0.28); }

    .school-logo {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: #fff;
      padding: 4px;
      object-fit: contain;
      margin-bottom: 0.6rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    header h1 { margin: 0.2rem 0; font-size: 1.9rem; font-weight: 800; }
    header p { margin: 0.3rem 0 0; color: #cbd5e1; font-size: 1.05rem; }

    .container {
      max-width: 1120px;
      margin: -1.5rem auto 3rem;
      padding: 0 1rem;
    }

    .form-card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.75rem;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.07);
      border: 1px solid var(--border);
      margin-bottom: 2rem;
    }
